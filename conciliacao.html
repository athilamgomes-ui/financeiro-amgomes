<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Conciliação — A.M. Gomes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#eef2f7;--card:#fff;--card2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--text2:#334155;--muted:#64748b;--muted2:#94a3b8;--accent:#0d9488;--ok:#059669;--warn:#d97706;--crit:#dc2626;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;font-size:13.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.page-header{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:18px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
h1{font-size:20px;font-weight:800}.subtitle{color:var(--muted);font-size:12.5px;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:11px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-weight:700;font-size:13px;color:var(--text2);box-shadow:var(--shadow)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sub{font-weight:600;color:var(--muted);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi-t{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi-v{font-size:22px;font-weight:800;margin:6px 0 2px}.kpi-s{font-size:11.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
h3{font-size:14px;font-weight:700;margin-bottom:12px}
.h4{font-size:12px;font-weight:700;margin-bottom:8px}.h4.crit{color:var(--crit)}.h4.warn{color:var(--warn)}
.row{display:grid;grid-template-columns:1fr 90px 92px;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.lbl{color:var(--text2)}.barw{background:#f1f5f9;border-radius:5px;height:10px;overflow:hidden}.bar{height:100%;border-radius:5px}
.val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2)}
.tot{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px}
.li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:11.5px}
.nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vv{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.pos{color:var(--ok)}.neg{color:var(--crit)}.muted{color:var(--muted)}.sm{font-size:11px}
.note{font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-top:4px}
.foot{text-align:center;color:var(--muted2);font-size:11px;margin:16px 0 6px}
.lock{max-width:380px;margin:60px auto;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:30px 28px;box-shadow:var(--shadow);text-align:center}
.lock h2{font-size:17px;font-weight:800;margin-bottom:6px}.lock p{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.lock input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;text-align:center}
.lock button{width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.lock .err{color:var(--crit);font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}body{padding:12px}}
</style></head><body>

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function dec(pass){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.data)));}
async function abrir(p){const h=await dec(p);document.getElementById('app').innerHTML=h;document.getElementById('app').style.display='block';document.getElementById('lock').style.display='none';try{sessionStorage.setItem('conc_ok',p)}catch(e){}}
async function ts(e){e.preventDefault();const el=document.getElementById('le');el.textContent='…';try{await abrir(document.getElementById('senha').value);el.textContent=''}catch(_){el.textContent='Senha incorreta.'}return false}
function showTab(k){document.querySelectorAll('.tabpane').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('pane-'+k).style.display='block';document.querySelector('.tab[data-tab="'+k+'"]').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
